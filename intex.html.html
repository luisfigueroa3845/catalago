<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esencia del Universo - Catálogo Oficial</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #050505;
      color: #ffffff;
    }
    .gold-border {
      border: 1.5px solid #eab308;
    }
    .card-bg {
      background-color: #0e0e0e;
      border: 1px solid #222222;
    }
    .input-field {
      background-color: #161616;
      border: 1px solid #333333;
      color: #ffffff;
    }
    .input-field:focus {
      border-color: #eab308;
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

  <!-- Header Superior -->
  <header class="w-full bg-[#0a0a0a] border-b border-[#1f1f1f] sticky top-0 z-40 px-3 py-2 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-1.5">
      <div id="mode-status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
      <span id="mode-status-text" class="text-[11px] sm:text-xs text-gray-400 font-medium">Vista Pública (Solo Lectura)</span>
    </div>
    
    <button id="btn-toggle-advisor" onclick="openPinModal()" class="gold-border bg-black hover:bg-yellow-500/10 text-yellow-500 font-bold px-2.5 py-1 rounded-lg text-[11px] sm:text-xs flex items-center gap-1.5 transition duration-200">
      <i data-lucide="lock" class="w-3.5 h-3.5"></i>
      <span>Acceso Asesor</span>
    </button>
  </header>

  <!-- Contenido Principal -->
  <main class="w-full max-w-xl px-2 sm:px-4 pt-3 flex flex-col items-center gap-3">

    <!-- Tarjeta del Asesor -->
    <div class="flex items-center gap-3 w-full bg-[#0c0c0c] border border-gray-800/80 rounded-xl p-2 px-3 shadow-md">
      <div class="relative w-12 h-12 flex-shrink-0">
        <img id="advisor-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Luis Figueroa" class="w-12 h-12 rounded-full object-cover gold-border p-0.5">
        
        <label id="btn-change-avatar" for="avatar-input" class="hidden absolute -bottom-1 -right-1 bg-yellow-500 text-black p-1 rounded-full cursor-pointer shadow-md">
          <i data-lucide="camera" class="w-3 h-3"></i>
          <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
        </label>
      </div>

      <div class="flex flex-col text-left">
        <div class="flex items-center gap-1 text-yellow-500">
          <i data-lucide="user-check" class="w-4 h-4"></i>
          <h1 id="advisor-name" class="text-sm font-bold text-white tracking-wide leading-none">Luis Figueroa</h1>
        </div>
        <p id="advisor-title" class="text-[9px] font-bold tracking-widest text-yellow-500 uppercase mt-1">ASESOR DE VENTAS</p>
      </div>
    </div>

    <!-- Encabezado / Logo y Promoción -->
    <div class="w-full grid grid-cols-5 gap-2">
      <!-- Logo Marca -->
      <div class="col-span-2 card-bg rounded-xl p-2.5 flex flex-col items-center justify-center text-center shadow-md border border-gray-800">
        <div class="w-9 h-9 mb-1 text-white flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-full h-full fill-current">
            <path d="M50 10 A40 40 0 1 0 90 50 A35 35 0 1 1 50 10 Z" fill="none" stroke="currentColor" stroke-width="4"/>
            <polygon points="65,22 67,27 72,27 68,30 70,35 65,32 60,35 62,30 58,27 63,27" fill="#eab308"/>
            <polygon points="78,38 79,41 82,41 80,43 81,46 78,44 75,46 76,43 74,41 77,41" fill="#eab308"/>
            <circle cx="45" cy="40" r="2.5" fill="#eab308"/>
            <circle cx="55" cy="32" r="2.5" fill="#eab308"/>
            <circle cx="68" cy="48" r="3" fill="#eab308"/>
            <circle cx="58" cy="62" r="2.5" fill="#eab308"/>
            <circle cx="48" cy="70" r="2.5" fill="#eab308"/>
            <line x1="45" y1="40" x2="55" y2="32" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2,2"/>
            <line x1="55" y1="32" x2="68" y2="48" stroke="#eab308" stroke-width="1.5"/>
            <line x1="68" y1="48" x2="58" y2="62" stroke="#eab308" stroke-width="1.5"/>
            <line x1="58" y1="62" x2="48" y2="70" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2,2"/>
          </svg>
        </div>
        <h2 class="text-xs font-black text-white leading-tight">Esencia del</h2>
        <h3 class="text-[11px] font-light text-gray-200">universo</h3>
        <p class="text-[7px] font-medium tracking-widest text-gray-400 uppercase mt-0.5">PERFUMERÍA</p>
      </div>

      <!-- Banner de Envío -->
      <div class="col-span-3 card-bg rounded-xl p-2.5 gold-border flex flex-col items-center justify-center text-center shadow-md">
        <div class="flex items-center gap-1.5 text-yellow-400 mb-1">
          <i data-lucide="truck" class="w-4 h-4"></i>
          <span class="text-[10px] font-black uppercase tracking-wider bg-yellow-500 text-black px-1.5 py-0.5 rounded">ENVÍO INCLUIDO</span>
        </div>
        <p id="promo-banner-text" class="text-[10px] font-semibold text-gray-200 leading-tight">
          Cada agenda incluye envío solo en zonas de <strong class="text-yellow-400 underline">CARACAS</strong>
        </p>
      </div>
    </div>

    <!-- Barra de Búsqueda y Botón Compartir -->
    <div class="w-full flex gap-1.5 items-center">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar por perfume, marca o #..." class="w-full input-field pl-9 pr-3 py-1.5 rounded-xl text-xs placeholder-gray-500">
      </div>
      <button onclick="openShareModal()" class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded-xl border border-gray-700 transition" title="Compartir Catálogo">
        <i data-lucide="share-2" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Cuadrícula de Productos (Catálogo) -->
    <div id="catalog-grid" class="w-full grid grid-cols-3 gap-1.5 sm:gap-2.5">
      <!-- Se genera dinámicamente con JS -->
    </div>

  </main>

  <!-- Modal PIN de Acceso Asesor -->
  <div id="pin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
    <div class="card-bg w-full max-w-xs rounded-2xl p-5 border border-yellow-500/30 text-center shadow-2xl">
      <div class="w-10 h-10 bg-yellow-500/10 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-2">
        <i data-lucide="key-round" class="w-5 h-5"></i>
      </div>
      <h3 class="text-base font-bold text-white mb-1">Acceso Asesor</h3>
      <p class="text-xs text-gray-400 mb-3">Clave de 4 dígitos para activar edición.</p>
      
      <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full input-field text-center text-lg tracking-widest font-mono py-1.5 rounded-xl mb-3">
      
      <div class="flex gap-2">
        <button onclick="closePinModal()" class="flex-1 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-semibold hover:bg-gray-700">Cancelar</button>
        <button onclick="verifyPin()" class="flex-1 bg-yellow-500 text-black py-2 rounded-xl text-xs font-bold hover:bg-yellow-400">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- Modal Edición de Producto -->
  <div id="edit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
    <div class="card-bg w-full max-w-sm rounded-2xl p-5 border border-gray-700 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-bold text-yellow-500 flex items-center gap-1.5">
          <i data-lucide="edit-3" class="w-4 h-4"></i>
          Editar Casilla #<span id="modal-slot-num">1</span>
        </h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="edit-form" onsubmit="saveProductEdit(event)" class="space-y-3">
        <input type="hidden" id="edit-slot-number">

        <div class="flex flex-col items-center">
          <img id="edit-img-preview" src="" alt="Preview" class="w-24 h-24 object-cover rounded-xl border border-gray-700 mb-2">
          <label class="bg-gray-800 hover:bg-gray-700 text-[11px] text-yellow-400 px-3 py-1 rounded-lg border border-gray-600 cursor-pointer flex items-center gap-1">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Cambiar Imagen
            <input type="file" id="edit-img-file" accept="image/*" class="hidden" onchange="handleProductImgUpload(event)">
          </label>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-400 block mb-0.5">Nombre Perfume</label>
          <input type="text" id="edit-name" required class="w-full input-field px-2.5 py-1.5 rounded-lg text-xs">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-gray-400 block mb-0.5">Precio (€)</label>
            <input type="number" step="0.01" id="edit-price" required class="w-full input-field px-2.5 py-1.5 rounded-lg text-xs">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-gray-400 block mb-0.5">Marca</label>
            <input type="text" id="edit-brand" required class="w-full input-field px-2.5 py-1.5 rounded-lg text-xs">
          </div>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-400 block mb-0.5">Contenido</label>
          <input type="text" id="edit-size" required placeholder="100 ml" class="w-full input-field px-2.5 py-1.5 rounded-lg text-xs">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-semibold hover:bg-gray-700">Cancelar</button>
          <button type="submit" class="flex-1 bg-yellow-500 text-black py-2 rounded-xl text-xs font-bold hover:bg-yellow-400">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Compartir -->
  <div id="share-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
    <div class="card-bg w-full max-w-xs rounded-2xl p-5 border border-gray-700 text-center shadow-2xl">
      <h3 class="text-sm font-bold text-white mb-3">Compartir Catálogo</h3>
      <div class="grid grid-cols-3 gap-2 mb-3">
        <button onclick="shareTo('whatsapp')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-emerald-950/40 text-emerald-400 border border-emerald-800 hover:bg-emerald-900/40 transition">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
          <span class="text-[9px] font-semibold">WhatsApp</span>
        </button>
        <button onclick="shareTo('facebook')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-blue-950/40 text-blue-400 border border-blue-800 hover:bg-blue-900/40 transition">
          <i data-lucide="facebook" class="w-5 h-5"></i>
          <span class="text-[9px] font-semibold">Facebook</span>
        </button>
        <button onclick="shareTo('copy')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-gray-800 text-gray-200 border border-gray-700 hover:bg-gray-700 transition">
          <i data-lucide="link" class="w-5 h-5"></i>
          <span class="text-[9px] font-semibold">Copiar</span>
        </button>
      </div>
      <button onclick="closeShareModal()" class="w-full bg-gray-800 text-gray-300 py-1.5 rounded-xl text-xs font-semibold hover:bg-gray-700">Cerrar</button>
    </div>
  </div>

  <script>
    // Configuración Inicial
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";
    const ADVISOR_PIN = "3845";
    const WHATSAPP_PHONE = "584127266335";
    
    let supabaseClient = null;
    let isAdvisorMode = false;
    let products = [];

    if (SUPABASE_URL.trim() !== "" && SUPABASE_ANON_KEY.trim() !== "") {
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.warn("⚠️ No se pudo inicializar Supabase, usando localStorage:", err);
      }
    }

    const initialProducts = [
      { slot_number: 1, name: "9 PM ELIXIR #1", price: 25.00, brand: "Afnan", size: "100 ml", image_url: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=400&q=80" },
      { slot_number: 2, name: "BESTIA NEGRA #2", price: 25.00, brand: "Armaf", size: "100 ml", image_url: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=400&q=80" },
      { slot_number: 3, name: "ASAD BOURBON #3", price: 25.00, brand: "Lattafa", size: "100 ml", image_url: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=400&q=80" },
      { slot_number: 4, name: "YUM YUM #4", price: 25.00, brand: "Armaf", size: "100 ml", image_url: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=400&q=80" },
      { slot_number: 5, name: "ECLAIRE #5", price: 25.00, brand: "Lattafa", size: "100 ml", image_url: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=400&q=80" },
      { slot_number: 6, name: "YARA CANDY #6", price: 25.00, brand: "Lattafa", size: "100 ml", image_url: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=400&q=80" }
    ];

    async function loadCatalogData() {
      let fetchedFromCloud = false;

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('slot_number', { ascending: true });

          if (!error && data && data.length > 0) {
            products = [];
            for (let i = 1; i <= 100; i++) {
              const item = data.find(p => p.slot_number === i);
              products.push(item ? item : createDefaultSlot(i));
            }
            fetchedFromCloud = true;
          }
        } catch (err) {
          console.warn("Error cargando Supabase:", err);
        }
      }

      if (!fetchedFromCloud) {
        const localData = localStorage.getItem("esencia_universe_products");
        if (localData) {
          products = JSON.parse(localData);
        } else {
          products = [];
          for (let i = 1; i <= 100; i++) {
            const match = initialProducts.find(p => p.slot_number === i);
            products.push(match ? match : createDefaultSlot(i));
          }
          saveProductsLocal();
        }
      }

      loadStoreSettings();
      renderCatalog();
    }

    function createDefaultSlot(slotNum) {
      return {
        slot_number: slotNum,
        name: `Perfume #${slotNum}`,
        price: 25.00,
        brand: "Lattafa",
        size: "100 ml",
        image_url: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=400&q=80"
      };
    }

    async function loadStoreSettings() {
      if (supabaseClient) {
        try {
          const { data } = await supabaseClient.from('store_settings').select('*').eq('id', 1).single();
          if (data && data.advisor_photo) {
            document.getElementById("advisor-avatar").src = data.advisor_photo;
          }
        } catch (e) {}
      } else {
        const savedAvatar = localStorage.getItem("esencia_universe_avatar");
        if (savedAvatar) {
          document.getElementById("advisor-avatar").src = savedAvatar;
        }
      }
    }

    function saveProductsLocal() {
      localStorage.setItem("esencia_universe_products", JSON.stringify(products));
    }

    function sendWhatsAppOrder(slotNum) {
      const prod = products.find(p => p.slot_number === slotNum);
      if (!prod) return;

      const text = `Hola Luis! Quisiera agendar el producto:\n` +
                   `📌 *${prod.name}*\n` +
                   `👑 Marca: ${prod.brand}\n` +
                   `🧪 Cantidad: ${prod.size}\n` +
                   `💰 Precio: €${Number(prod.price).toFixed(2)}\n` +
                   `📍 Solicito disponibilidad y datos para envío.`;

      const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
      window.open(waUrl, '_blank');
    }

    function renderCatalog(itemsToRender = products) {
      const grid = document.getElementById("catalog-grid");
      grid.innerHTML = "";

      const whatsappIconSVG = `<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>`;

      itemsToRender.forEach(prod => {
        const card = document.createElement("div");
        card.className = "card-bg rounded-xl p-1.5 flex flex-col justify-between relative shadow-md border border-gray-800/80";

        card.innerHTML = `
          <div class="absolute top-2 left-2 z-10 bg-black/90 gold-border text-yellow-400 font-extrabold text-[9px] px-1.5 py-0.2 rounded shadow">
            #${prod.slot_number}
          </div>

          ${isAdvisorMode ? `
            <button onclick="openEditModal(${prod.slot_number})" class="absolute top-2 right-2 z-10 bg-yellow-500 text-black p-1 rounded-full shadow hover:bg-yellow-400">
              <i data-lucide="pencil" class="w-3 h-3"></i>
            </button>
          ` : ''}

          <div class="w-full h-28 sm:h-36 rounded-lg overflow-hidden bg-gray-900 mb-1.5">
            <img src="${prod.image_url}" alt="${prod.name}" class="w-full h-full object-cover">
          </div>

          <h4 class="text-[10px] font-extrabold text-white uppercase tracking-tight mb-1 line-clamp-1 px-0.5">${prod.name}</h4>

          <div class="space-y-1 mb-2 text-[10px]">
            <div class="bg-[#161616] border border-gray-800 rounded px-1.5 py-0.5 flex items-center gap-1">
              <i data-lucide="tag" class="w-3 h-3 text-yellow-400 flex-shrink-0"></i>
              <span class="font-bold text-yellow-400 truncate">€${Number(prod.price).toFixed(2)}</span>
            </div>

            <div class="bg-[#161616] border border-gray-800 rounded px-1.5 py-0.5 flex items-center gap-1">
              <i data-lucide="crown" class="w-3 h-3 text-yellow-400 flex-shrink-0"></i>
              <span class="font-medium text-gray-300 truncate">${prod.brand}</span>
            </div>

            <div class="bg-[#161616] border border-gray-800 rounded px-1.5 py-0.5 flex items-center gap-1">
              <i data-lucide="flask-conical" class="w-3 h-3 text-yellow-400 flex-shrink-0"></i>
              <span class="font-medium text-gray-300 truncate">${prod.size}</span>
            </div>
          </div>

          <button onclick="sendWhatsAppOrder(${prod.slot_number})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 rounded-lg text-[10px] flex items-center justify-center gap-1.5 shadow transition cursor-pointer">
            ${whatsappIconSVG}
            <span>Agendar</span>
          </button>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function filterProducts() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      const filtered = products.filter(p => 
        p.name.toLowerCase().includes(query) ||
        p.brand.toLowerCase().includes(query) ||
        p.slot_number.toString() === query
      );
      renderCatalog(filtered);
    }

    function openPinModal() {
      if (isAdvisorMode) {
        isAdvisorMode = false;
        updateAdvisorUI();
        return;
      }
      document.getElementById("pin-modal").classList.remove("hidden");
      document.getElementById("pin-input").value = "";
      document.getElementById("pin-input").focus();
    }

    function closePinModal() {
      document.getElementById("pin-modal").classList.add("hidden");
    }

    function verifyPin() {
      const input = document.getElementById("pin-input").value;
      if (input === ADVISOR_PIN) {
        isAdvisorMode = true;
        closePinModal();
        updateAdvisorUI();
      } else {
        alert("PIN incorrecto.");
      }
    }

    function updateAdvisorUI() {
      const dot = document.getElementById("mode-status-dot");
      const text = document.getElementById("mode-status-text");
      const btn = document.getElementById("btn-toggle-advisor");
      const changeAvatarBtn = document.getElementById("btn-change-avatar");

      if (isAdvisorMode) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        text.innerText = "Modo Asesor (Edición Activa)";
        text.className = "text-[11px] sm:text-xs text-emerald-400 font-semibold";
        btn.innerHTML = `<i data-lucide="unlock" class="w-3.5 h-3.5"></i><span>Salir Asesor</span>`;
        changeAvatarBtn.classList.remove("hidden");
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-gray-400";
        text.innerText = "Vista Pública (Solo Lectura)";
        text.className = "text-[11px] sm:text-xs text-gray-400 font-medium";
        btn.innerHTML = `<i data-lucide="lock" class="w-3.5 h-3.5"></i><span>Acceso Asesor</span>`;
        changeAvatarBtn.classList.add("hidden");
      }
      lucide.createIcons();
      renderCatalog();
    }

    let currentTempImage = "";

    function openEditModal(slotNum) {
      const prod = products.find(p => p.slot_number === slotNum);
      if (!prod) return;

      document.getElementById("modal-slot-num").innerText = prod.slot_number;
      document.getElementById("edit-slot-number").value = prod.slot_number;
      document.getElementById("edit-name").value = prod.name;
      document.getElementById("edit-price").value = prod.price;
      document.getElementById("edit-brand").value = prod.brand;
      document.getElementById("edit-size").value = prod.size;
      document.getElementById("edit-img-preview").src = prod.image_url;
      currentTempImage = prod.image_url;

      document.getElementById("edit-modal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.add("hidden");
    }

    async function saveProductEdit(e) {
      e.preventDefault();
      const slot = parseInt(document.getElementById("edit-slot-number").value);
      const index = products.findIndex(p => p.slot_number === slot);

      if (index !== -1) {
        const updatedProduct = {
          slot_number: slot,
          name: document.getElementById("edit-name").value,
          price: parseFloat(document.getElementById("edit-price").value),
          brand: document.getElementById("edit-brand").value,
          size: document.getElementById("edit-size").value,
          image_url: currentTempImage
        };

        products[index] = updatedProduct;
        saveProductsLocal();
        renderCatalog();

        if (supabaseClient) {
          try {
            await supabaseClient.from('products').upsert(updatedProduct, { onConflict: 'slot_number' });
          } catch (err) {
            console.error("Error en Supabase:", err);
          }
        }

        closeEditModal();
      }
    }

    function compressImage(file, maxWidth = 650, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };
      });
    }

    async function handleProductImgUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const compressed = await compressImage(file, 650, 0.75);
        currentTempImage = compressed;
        document.getElementById("edit-img-preview").src = compressed;
      }
    }

    async function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const compressed = await compressImage(file, 350, 0.80);
        document.getElementById("advisor-avatar").src = compressed;
        localStorage.setItem("esencia_universe_avatar", compressed);

        if (supabaseClient) {
          try {
            await supabaseClient.from('store_settings').upsert({ id: 1, advisor_photo: compressed });
          } catch (err) {}
        }
      }
    }

    function openShareModal() {
      document.getElementById("share-modal").classList.remove("hidden");
    }
    function closeShareModal() {
      document.getElementById("share-modal").classList.add("hidden");
    }
    function shareTo(platform) {
      const url = window.location.href;
      const text = "¡Explora el catálogo oficial de Esencia del Universo!";

      if (platform === "whatsapp") {
        window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + url)}`, "_blank");
      } else if (platform === "facebook") {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, "_blank");
      } else if (platform === "copy") {
        navigator.clipboard.writeText(url);
        alert("¡Enlace copiado al portapapeles!");
      }
      closeShareModal();
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadCatalogData();
    });
  </script>
</body>
</html>
